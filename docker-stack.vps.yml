# Déploiement Docker Swarm/Dokploy.
# Les images sont construites et chargées séparément ; aucun secret n'est
# stocké dans ce fichier. Le service API rejoint le réseau de la vitrine afin
# que Nginx puisse résoudre l'alias `wallet-api`.
services:
  wallet-web:
    image: ${WALLET_WEB_IMAGE:?WALLET_WEB_IMAGE is required}
    networks:
      wallet-private:
      dokploy-network:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=dokploy-network
        - traefik.http.routers.wallet-manager-independent.rule=Host(`wallet-manager.causalset.sbs`)
        - traefik.http.routers.wallet-manager-independent.entrypoints=websecure
        - traefik.http.routers.wallet-manager-independent.tls.certresolver=letsencrypt
        - traefik.http.routers.wallet-manager-independent.priority=100
        - traefik.http.services.wallet-manager-independent.loadbalancer.server.port=80

  wallet-api:
    image: ${WALLET_API_IMAGE:?WALLET_API_IMAGE is required}
    env_file:
      - ./server/.env
    environment:
      MINIO_ENDPOINT: wallet-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: wallet-attachments
    expose:
      - "3000"
    networks:
      wallet-private:
      dokploy-network:
        aliases:
          - wallet-api
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first

  wallet-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wallet-postgres:/var/lib/postgresql/data
    networks:
      - wallet-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  wallet-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - wallet-minio:/data
    networks:
      - wallet-private
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  wallet-postgres:
  wallet-minio:

networks:
  wallet-private:
    driver: overlay
    attachable: true
  dokploy-network:
    external: true
    name: dokploy-network
