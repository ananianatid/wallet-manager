# Déploiement Docker Swarm/Dokploy.
# Les images sont construites et chargées séparément ; aucun secret n'est
# stocké dans ce fichier. Le service API est exposé par son propre endpoint.
services:
  wallet-api:
    image: ${WALLET_API_IMAGE:?WALLET_API_IMAGE is required}
    # Dokploy injecte les variables via `environment:` — plus de `env_file` qui
    # nécessiterait un fichier hôte `server/.env` (gitignoré) et cassait le
    # deploy `cannot create .../code/server/.env: Directory nonexistent`.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      MINIO_ENDPOINT: wallet-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: wallet-attachments
    expose:
      - "3000"
    networks:
      wallet-private:
      dokploy-network:
        aliases:
          - wallet-api
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=dokploy-network
        - traefik.http.routers.wallet-api.rule=Host(`wallet-api.causalset.sbs`)
        - traefik.http.routers.wallet-api.entrypoints=websecure
        - traefik.http.routers.wallet-api.tls.certresolver=letsencrypt
        - traefik.http.routers.wallet-api.priority=10
        - traefik.http.services.wallet-api.loadbalancer.server.port=3000
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first

  wallet-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wallet-postgres:/var/lib/postgresql/data
    networks:
      - wallet-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  wallet-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - wallet-minio:/data
    networks:
      - wallet-private
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  wallet-postgres:
  wallet-minio:

networks:
  wallet-private:
    driver: overlay
    attachable: true
  dokploy-network:
    external: true
    name: dokploy-network
