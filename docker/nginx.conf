server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        # Résolution à la requête : la vitrine reste démarrable seule et
        # détectera le service API dès qu'il sera présent sur le réseau Docker.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $wallet_api http://wallet-api:3000;
        proxy_pass $wallet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Expo Router static export écrit les écrans sous forme de fichiers
    # (par exemple /app/accounts.html). Normaliser une URL terminée par /
    # évite que Nginx tente d'ouvrir un répertoire inexistant et renvoie 403.
    location ~ ^/(.+)/$ {
        rewrite ^/(.*)/$ /$1 last;
    }

    location = /app-release.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=wallet-manager.apk" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        # Les add_header de cette location remplacent ceux du niveau server.
        # Ils doivent donc être répétés pour que SQLite web reste isolé dans
        # son worker et puisse utiliser SharedArrayBuffer.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
