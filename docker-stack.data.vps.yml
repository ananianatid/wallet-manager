# Amorçage indépendant des données pour le VPS Swarm.
# Le déploiement complet utilise ensuite docker-stack.vps.yml avec les mêmes
# noms de services, volumes et réseau privé.
services:
  wallet-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wallet-postgres:/var/lib/postgresql/data
    networks:
      - wallet-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  wallet-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - wallet-minio:/data
    networks:
      - wallet-private
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  wallet-postgres:
  wallet-minio:

networks:
  wallet-private:
    driver: overlay
    attachable: true
